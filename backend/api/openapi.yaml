openapi: 3.0.3
info:
  title: PigeonDrop API
  version: 0.1.0
  description: |
    HTTP contract of the PigeonDrop server. This file is the source of truth: the Go
    server interface (internal/api) is generated from it, and the web client's types
    will be generated from it too. Run `make generate` after editing.

    The routes without a prefix are those of the current watch app (API_SPEC.md at the
    repository root); they stay exactly as the Node prototype had them. The `/v1` routes are
    the new API, for people (the web client): registration by invitation, sign-in, sessions.
    Errors there carry a machine-readable `code`.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [ops]
      summary: Liveness and database check
      description: Answers 200 while the server can reach its database, 503 otherwise. Used by Docker and Coolify health checks.
      responses:
        '200':
          description: The server and its database are fine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /messages:
    post:
      operationId: postMessage
      tags: [ingest]
      summary: Upload a recording
      description: |
        Called by the phone's Side Service once it has received every part of a recording from the
        watch. `audio` is the base64 of a standard Ogg/Opus file (the older Zepp framing is still
        accepted, detected from the first bytes).

        The upload is idempotent by `fileName`: repeating it returns the stored result and saves
        nothing new. A recording is kept even when it cannot be converted to WAV; then `wavFile` is null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: The recording was stored (now, or by an earlier identical upload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '400':
          description: The body is not valid JSON, a field is missing, or `audio` is not valid base64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The request body is larger than the server accepts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts:
    post:
      operationId: postAccount
      tags: [accounts]
      summary: Create an account for a device code, or return the existing one
      description: |
        Idempotent: if the account exists it is returned as it is, nothing is overwritten. Called by the
        watch (through the phone) right after it generates its code, and by the setup page when it loads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The body is not valid JSON, or `code` is missing or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Read an account
      description: Called by the watch (through the phone) when the user presses "Синхронизация". `serverUrl` is the address uploads should go to.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: No such account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: putAccount
      tags: [accounts]
      summary: Set or reset the account's own server
      description: |
        Called by the setup page. `customServerUrl` must be present: a string starting with http:// or https://,
        or null to go back to this server. This never creates an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetServerRequest'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The body is not valid JSON, or `customServerUrl` is missing, or neither null nor an http(s) URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account with an invitation code, and sign in
      description: |
        Registration is by invitation only: the code comes from the server's operator (`pigeondrop invite create`).
        The code is spent only if the account is created; a rejected request leaves it usable. On success the
        response sets the session cookie, so the person is signed in.

        An unknown, expired or already used code all answer `invalid_invite`, so the answer does not tell which.
        Repeated bad codes from one address are slowed down (`too_many_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created and the session started.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The body is malformed (`invalid_request`), the email is not an address (`invalid_email`), or the password breaks the length rules (`weak_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The invitation code is not valid (`invalid_invite`), or the request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: That email is already registered (`email_taken`). The invitation code is not spent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      description: |
        Starts a new session and sets its cookie; sessions started earlier stay valid. An unknown email and a
        wrong password give the same answer and take the same time. After repeated failures for an email, or from
        an address, further attempts are refused for a while (`too_many_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The body is malformed (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The email or the password is wrong (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Always answers 204 and clears the cookie, also when there was no session, so it can be called without checking first.
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '403':
          description: The request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password
      description: |
        Needs the current password. Every other session of the user ends; the one making the request stays.
        A wrong current password counts toward the same limit as failed sign-ins.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '400':
          description: The body is malformed (`invalid_request`) or the new password breaks the length rules (`weak_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The current password is wrong (`wrong_password`), or the request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/code:
    post:
      operationId: startDevicePairing
      tags: [devices]
      summary: A watch asks to be paired
      description: |
        The first step of pairing (the device authorization grant of RFC 8628), called by the watch through the
        phone. No sign-in: the watch has nothing yet. The answer holds two codes. `deviceCode` is a secret that
        only the watch knows; it polls `/v1/device/token` with it. `userCode` is short and is shown to the person
        (as text and inside the QR code that opens `verificationUriComplete`), who approves it on the pairing page
        while signed in. A pairing lives `expiresIn` seconds.

        Requests are limited per address (`too_many_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPairingRequest'
      responses:
        '200':
          description: The codes for this pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        '400':
          description: The body is malformed (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/token:
    post:
      operationId: pollDevicePairing
      tags: [devices]
      summary: The watch asks whether its pairing was approved
      description: |
        Polled by the watch every `interval` seconds. While the person has not approved, the answer is
        `{ "status": "pending" }`. After approval the next poll answers `{ "status": "approved" }` with the device
        token, **once**: the token is not stored in a form that can be shown again, and a second poll of the same
        pairing is `invalid_device_code`. The watch keeps the token and sends it with every upload.

        Polling faster than the server allows is answered 429 with `Retry-After`; such a poll counts for nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollPairingRequest'
      responses:
        '200':
          description: Still waiting for approval, or approved (with the token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollPairingResult'
        '400':
          description: The device code is unknown or its token was already collected (`invalid_device_code`), or the pairing ran out of time unapproved (`expired_token`). Either way the watch starts over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/pairing/{userCode}:
    parameters:
      - name: userCode
        in: path
        required: true
        description: The code shown on the watch. Case and the dash do not matter.
        schema:
          type: string
    get:
      operationId: getDevicePairing
      tags: [devices]
      summary: What a user code is waiting for
      description: |
        Lets the pairing page show the person which watch is asking before they approve it. Unknown, expired and
        already approved codes are all `invalid_user_code`. Wrong codes are limited per user and per address.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No open pairing has this code (`invalid_user_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/approve:
    post:
      operationId: approveDevicePairing
      tags: [devices]
      summary: Pair the watch that shows this code with the signed-in user
      description: |
        The person's half of pairing. The watch's next poll receives its token. The person should compare the code
        with the one on the watch's screen before approving: a link can be made to point at someone else's code.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePairingRequest'
      responses:
        '204':
          description: Approved.
        '400':
          description: The body is malformed, or the name is too long (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No open pairing has this code (`invalid_user_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: The user's paired watches
      description: Revoked devices are not listed.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The devices, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a watch
      description: |
        The device's token stops working at once. What the device already uploaded stays. Revoking twice is fine.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: The device is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user has no such device (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # The three routes below are for people with a browser, not for the apps. They are documented here but
  # written by hand (tag "manual" keeps them out of code generation): they serve HTML and files, with range
  # requests, which the generated JSON handlers are not built for.
  /setup:
    get:
      operationId: getSetupPage
      tags: [manual]
      summary: The page the watch's QR code opens
      description: Static HTML. The `code` query parameter is read by the page itself in the browser, not by the server.
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema:
                type: string
  /uploads:
    get:
      operationId: listUploads
      tags: [manual]
      summary: List stored recordings, newest first
      description: |
        For listening to recordings from a browser. **Not protected**: anyone who knows the address sees every
        recording. The new account model replaces this with authenticated access.
      responses:
        '200':
          description: A list of links.
          content:
            text/html:
              schema:
                type: string
  /uploads/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: A stored file's name, as returned in `savedAs` or `wavFile` (not the watch's `fileName`).
        schema:
          type: string
    get:
      operationId: getUpload
      tags: [manual]
      summary: Download or play a stored file
      description: Content type is audio/wav for .wav, audio/ogg for an Ogg/Opus .opus, application/octet-stream otherwise. Range requests are supported.
      responses:
        '200':
          description: The file.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: The name is not a plain file name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pd_session
      description: |
        The session cookie, set by `register` and `login`. It is `HttpOnly` and `SameSite=Lax`; when the server runs
        over HTTPS it is also `Secure` and named `__Host-pd_session`. Browsers handle it by themselves.
  headers:
    SetSessionCookie:
      description: Sets (or, on logout, clears) the session cookie.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Not signed in, or the session has expired (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Too many failed attempts for now (`too_many_attempts`).
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Language:
      type: string
      enum: [en, ru]
    RegisterRequest:
      type: object
      required: [inviteCode, email, password]
      properties:
        inviteCode:
          type: string
          maxLength: 64
          description: The invitation code. Case, dashes and spaces do not matter.
          example: 7K3M-Q9XD-4TNA-B2WH-C8RY
        email:
          type: string
          maxLength: 254
          example: alice@example.com
        password:
          type: string
          maxLength: 1024
          description: At least 12 characters, at most 256 bytes (after Unicode NFKC normalisation).
        language:
          $ref: '#/components/schemas/Language'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 1024
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          maxLength: 1024
    User:
      type: object
      required: [id, email, plan, language, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        plan:
          type: string
          enum: [free, paid]
        language:
          $ref: '#/components/schemas/Language'
        createdAt:
          type: string
          format: date-time
    StartPairingRequest:
      type: object
      properties:
        clientName:
          type: string
          maxLength: 64
          description: What the watch calls itself (for example its model). Shown to the person approving, and offered as the device's name.
          example: Amazfit Balance
    Pairing:
      type: object
      required: [deviceCode, userCode, verificationUri, verificationUriComplete, expiresIn, interval]
      properties:
        deviceCode:
          type: string
          description: The secret the watch polls with. Never shown to people.
        userCode:
          type: string
          description: The short code to show, in the form BCDF-GHJK.
          example: BCDF-GHJK
        verificationUri:
          type: string
          description: The page where the person approves, to be shown as text.
          example: https://pigeon.example.com/pair
        verificationUriComplete:
          type: string
          description: The same page with the code filled in; the content of the QR code.
          example: https://pigeon.example.com/pair?code=BCDF-GHJK
        expiresIn:
          type: integer
          description: Seconds the pairing stays open.
        interval:
          type: integer
          description: Seconds the watch should wait between polls.
    PollPairingRequest:
      type: object
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
          maxLength: 128
    PollPairingResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved]
        interval:
          type: integer
          description: With `pending`, seconds to wait before the next poll.
        deviceToken:
          type: string
          description: With `approved`, the token to send in the Authorization header, as `Bearer <token>`. Shown this once.
        deviceId:
          type: string
          format: uuid
          description: With `approved`, the new device's id.
    PairingInfo:
      type: object
      required: [userCode, clientName, expiresAt]
      properties:
        userCode:
          type: string
          example: BCDF-GHJK
        clientName:
          type: string
          nullable: true
          description: What the watch calls itself. Chosen by the watch, so not to be trusted or rendered as markup.
        expiresAt:
          type: string
          format: date-time
    ApprovePairingRequest:
      type: object
      required: [userCode]
      properties:
        userCode:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 64
          description: The device's name in the user's list. Defaults to the name the watch gave itself.
    Device:
      type: object
      required: [id, name, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: When the device last called the API (recorded at most once an hour); null if it never has.
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    ErrorCode:
      type: string
      description: What went wrong, for clients to act on and translate. `error` is an English sentence for logs.
      enum:
        - invalid_request
        - invalid_email
        - weak_password
        - invalid_invite
        - email_taken
        - invalid_credentials
        - wrong_password
        - unauthorized
        - too_many_attempts
        - forbidden_origin
        - invalid_user_code
        - invalid_device_code
        - expired_token
        - not_found
    AccountRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 128
          description: The device code the watch generated.
          example: m0x1y2z-ab12cd
    SetServerRequest:
      type: object
      required: [customServerUrl]
      properties:
        customServerUrl:
          type: string
          description: An http(s) URL, or null for this server (OpenAPI 3.0 cannot say "string or null" here without making the generated type indistinguishable from "missing"). Required, so that an empty body can never reset it by accident.
          # Kept raw so the handler can tell "missing" from "null"; a plain pointer cannot.
          # (the generated file already imports encoding/json for its own use)
          x-go-type: json.RawMessage
    Account:
      type: object
      required: [ok, code, customServerUrl, serverUrl, createdAt, updatedAt]
      properties:
        ok:
          type: boolean
          description: Always true.
        code:
          type: string
        customServerUrl:
          type: string
          nullable: true
          description: The server the user chose, or null for this one.
        serverUrl:
          type: string
          description: Where uploads go - computed, never stored - `customServerUrl`, or this server's own address when that is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UploadRequest:
      type: object
      required: [fileName, audio]
      properties:
        fileName:
          type: string
          maxLength: 255
          description: The recording's name on the watch. Also the idempotency key.
          example: voice_1791004922779.opus
        audio:
          type: string
          description: Base64 of the recording (Ogg/Opus).
    UploadResult:
      type: object
      required: [ok, bytesReceived, savedAs, wavFile, receivedAt]
      properties:
        ok:
          type: boolean
          description: Always true.
        bytesReceived:
          type: integer
          format: int64
          description: Size of the decoded recording in bytes.
        savedAs:
          type: string
          description: Name the server stored the recording under (by the time the server received it).
          example: 2026-10-03_07-23-36-048.opus
        wavFile:
          type: string
          nullable: true
          description: Name of the converted WAV file, or null if conversion failed.
          example: 2026-10-03_07-23-36-048.wav
        receivedAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: Always true.
    Error:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          description: Always false.
        error:
          type: string
          description: Short, human-readable reason in English.
        code:
          $ref: '#/components/schemas/ErrorCode'
