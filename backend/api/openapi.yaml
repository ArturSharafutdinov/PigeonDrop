openapi: 3.0.3
info:
  title: PigeonDrop API
  version: 0.1.0
  description: |
    HTTP contract of the PigeonDrop server. This file is the source of truth: the Go
    server interface (internal/api) is generated from it, and the web client's types
    will be generated from it too. Run `make generate` after editing.

    Everything is under `/v1` except the health check: the watch app and the people's web
    client use the same API (API_SPEC.md at the repository root has the prose version). Errors
    carry a machine-readable `code`.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [ops]
      summary: Liveness and database check
      description: Answers 200 while the server can reach its database, 503 otherwise. Used by Docker and Coolify health checks.
      responses:
        '200':
          description: The server and its database are fine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account with an invitation code, and sign in
      description: |
        Registration is by invitation only: the code comes from the server's operator (`pigeondrop invite create`).
        The code is spent only if the account is created; a rejected request leaves it usable. On success the
        response sets the session cookie, so the person is signed in.

        An unknown, expired or already used code all answer `invalid_invite`, so the answer does not tell which.
        Repeated bad codes from one address are slowed down (`too_many_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created and the session started.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The body is malformed (`invalid_request`), the email is not an address (`invalid_email`), or the password breaks the length rules (`weak_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The invitation code is not valid (`invalid_invite`), or the request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: That email is already registered (`email_taken`). The invitation code is not spent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      description: |
        Starts a new session and sets its cookie; sessions started earlier stay valid. An unknown email and a
        wrong password give the same answer and take the same time. After repeated failures for an email, or from
        an address, further attempts are refused for a while (`too_many_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The body is malformed (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The email or the password is wrong (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Always answers 204 and clears the cookie, also when there was no session, so it can be called without checking first.
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '403':
          description: The request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password
      description: |
        Needs the current password. Every other session of the user ends; the one making the request stays.
        A wrong current password counts toward the same limit as failed sign-ins.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '400':
          description: The body is malformed (`invalid_request`) or the new password breaks the length rules (`weak_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The current password is wrong (`wrong_password`), or the request came from a foreign web page (`forbidden_origin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/code:
    post:
      operationId: startDevicePairing
      tags: [devices]
      summary: A watch asks to be paired
      description: |
        The first step of pairing (the device authorization grant of RFC 8628), called by the watch through the
        phone. No sign-in: the watch has nothing yet. The answer holds two codes. `deviceCode` is a secret that
        only the watch knows; it polls `/v1/device/token` with it. `userCode` is short and is shown to the person
        (as text and inside the QR code that opens `verificationUriComplete`), who approves it on the pairing page
        while signed in. A pairing lives `expiresIn` seconds.

        Requests are limited per address (`too_many_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPairingRequest'
      responses:
        '200':
          description: The codes for this pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        '400':
          description: The body is malformed (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/token:
    post:
      operationId: pollDevicePairing
      tags: [devices]
      summary: The watch asks whether its pairing was approved
      description: |
        Polled by the watch every `interval` seconds. While the person has not approved, the answer is
        `{ "status": "pending" }`. After approval the next poll answers `{ "status": "approved" }` with the device
        token, **once**: the token is not stored in a form that can be shown again, and a second poll of the same
        pairing is `invalid_device_code`. The watch keeps the token and sends it with every upload.

        Polling faster than the server allows is answered 429 with `Retry-After`; such a poll counts for nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollPairingRequest'
      responses:
        '200':
          description: Still waiting for approval, or approved (with the token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollPairingResult'
        '400':
          description: The device code is unknown or its token was already collected (`invalid_device_code`), or the pairing ran out of time unapproved (`expired_token`). Either way the watch starts over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/pairing/{userCode}:
    parameters:
      - name: userCode
        in: path
        required: true
        description: The code shown on the watch. Case and the dash do not matter.
        schema:
          type: string
    get:
      operationId: getDevicePairing
      tags: [devices]
      summary: What a user code is waiting for
      description: |
        Lets the pairing page show the person which watch is asking before they approve it. Unknown, expired and
        already approved codes are all `invalid_user_code`. Wrong codes are limited per user and per address.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No open pairing has this code (`invalid_user_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/device/approve:
    post:
      operationId: approveDevicePairing
      tags: [devices]
      summary: Pair the watch that shows this code with the signed-in user
      description: |
        The person's half of pairing. The watch's next poll receives its token. The person should compare the code
        with the one on the watch's screen before approving: a link can be made to point at someone else's code.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePairingRequest'
      responses:
        '204':
          description: Approved.
        '400':
          description: The body is malformed, or the name is too long (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No open pairing has this code (`invalid_user_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: The user's paired watches
      description: Revoked devices are not listed.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The devices, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a watch
      description: |
        The device's token stops working at once. What the device already uploaded stays. Revoking twice is fine.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: The device is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user has no such device (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/messages:
    post:
      operationId: uploadMessage
      tags: [messages]
      summary: A watch uploads a recording
      description: |
        Called by the phone's Side Service, with the device token the watch received when it was paired, once it has
        every part of a recording. `audio` is the base64 of a standard Ogg/Opus file (Zepp's older framing is still
        accepted, detected from the first bytes). The recording is stored for the device's owner.

        Idempotent by `messageId` within the device: repeating an upload returns the stored result and saves nothing
        new, while another device may use the same `messageId` without meeting it. A recording is kept even when it
        cannot be decoded (`hasWav` is then false in the list).

        Limits. One recording is at most 512 KiB (a minute is about 140 KiB), refused with 413 beyond that. A device
        may upload 60 times an hour (every request counts, repeats included), refused with 429 and `Retry-After`
        beyond that. Each account has 100 MiB of storage: when a new recording does not fit, the account's oldest
        recordings are deleted to make room and the new one is always accepted. `storage` in the answer says how
        full the account is, so the watch can warn the person: `nearly_full` from 90%, `full` when this very upload
        had to delete older recordings.
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadMessageRequest'
      responses:
        '200':
          description: The recording was stored (now, or by an earlier identical upload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadMessageResult'
        '400':
          description: The body is malformed, a field is missing, or `audio` is not valid base64 (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The device token is missing, unknown, or revoked (`unauthorized`). The watch must be paired again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
    get:
      operationId: listMessages
      tags: [messages]
      summary: The user's recordings, newest first
      description: Only the signed-in user's own messages, from all their devices.
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          description: How many to return (1 to 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          description: The `nextCursor` of the previous page. Opaque.
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '400':
          description: The limit is out of range, or `before` is not a cursor this server gave out (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteAllMessages
      tags: [messages]
      summary: Delete all of the user's recordings and their files
      description: |
        The way to free the whole storage at once. Only the signed-in user's own recordings go; devices stay paired.
        Deleting when there is nothing to delete is fine (`deleted` is then 0).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The recordings are deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAllResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/storage:
    get:
      operationId: getStorage
      tags: [messages]
      summary: How full the user's storage is
      description: |
        What the user's recordings take, against the limit of their plan. Only the recordings themselves count (the
        original files); the WAV played in a browser is made when it is played and takes no room.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a recording and its files
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user has no such message (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # Written by hand (the tag "manual" keeps it out of code generation): it streams a zip file, which the
  # generated JSON handlers are not built for.
  /v1/messages/archive:
    get:
      operationId: getMessagesArchive
      tags: [manual]
      summary: Download all recordings in one zip
      description: |
        Every recording of the user as the files were received (`.opus`, named `PigeonDrop-<date>_<time>.opus`
        after the time they were received, in UTC), stored in the zip without compression. The zip is named
        after the time of the request (`PigeonDrop-<date>_<time>.zip`).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The zip file.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user has no recordings (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # Written by hand (the tag "manual" keeps it out of code generation): it serves a file, with range
  # requests, which the generated JSON handlers are not built for.
  /v1/messages/{id}/audio:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        description: '`wav` (the default when the recording can be decoded; it is made from the original on each request) or `original` (the file as it was received, an Ogg/Opus file).'
        schema:
          type: string
          enum: [wav, original]
    get:
      operationId: getMessageAudio
      tags: [manual]
      summary: Play or download a recording
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The audio. Range requests are supported.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user has no such message, or no such format of it (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      description: |
        The device token a watch receives when it is paired (`pdd_` followed by 43 characters), sent in the
        Authorization header as `Bearer <token>`. It can be revoked, after which it is refused at once.
    cookieAuth:
      type: apiKey
      in: cookie
      name: pd_session
      description: |
        The session cookie, set by `register` and `login`. It is `HttpOnly` and `SameSite=Lax`; when the server runs
        over HTTPS it is also `Secure` and named `__Host-pd_session`. Browsers handle it by themselves.
  headers:
    SetSessionCookie:
      description: Sets (or, on logout, clears) the session cookie.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Not signed in, or the session has expired (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The recording, or the request carrying it, is larger than the server accepts (`payload_too_large`). Sending it again will not help.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Too many attempts for now (`too_many_attempts`).
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Language:
      type: string
      enum: [en, ru]
    RegisterRequest:
      type: object
      required: [inviteCode, email, password]
      properties:
        inviteCode:
          type: string
          maxLength: 64
          description: The invitation code. Case, dashes and spaces do not matter.
          example: 7K3M-Q9XD-4TNA-B2WH-C8RY
        email:
          type: string
          maxLength: 254
          example: alice@example.com
        password:
          type: string
          maxLength: 1024
          description: At least 12 characters, at most 256 bytes (after Unicode NFKC normalisation).
        language:
          $ref: '#/components/schemas/Language'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 1024
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          maxLength: 1024
    User:
      type: object
      required: [id, email, plan, language, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        plan:
          type: string
          enum: [free, paid]
        language:
          $ref: '#/components/schemas/Language'
        createdAt:
          type: string
          format: date-time
    StartPairingRequest:
      type: object
      properties:
        clientName:
          type: string
          maxLength: 64
          description: What the watch calls itself (for example its model). Shown to the person approving, and offered as the device's name.
          example: Amazfit Balance
    Pairing:
      type: object
      required: [deviceCode, userCode, verificationUri, verificationUriComplete, expiresIn, interval]
      properties:
        deviceCode:
          type: string
          description: The secret the watch polls with. Never shown to people.
        userCode:
          type: string
          description: The short code to show, in the form BCDF-GHJK.
          example: BCDF-GHJK
        verificationUri:
          type: string
          description: The page where the person approves, to be shown as text.
          example: https://pigeon.example.com/pair
        verificationUriComplete:
          type: string
          description: The same page with the code filled in; the content of the QR code.
          example: https://pigeon.example.com/pair?code=BCDF-GHJK
        expiresIn:
          type: integer
          description: Seconds the pairing stays open.
        interval:
          type: integer
          description: Seconds the watch should wait between polls.
    PollPairingRequest:
      type: object
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
          maxLength: 128
    PollPairingResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved]
        interval:
          type: integer
          description: With `pending`, seconds to wait before the next poll.
        deviceToken:
          type: string
          description: With `approved`, the token to send in the Authorization header, as `Bearer <token>`. Shown this once.
        deviceId:
          type: string
          format: uuid
          description: With `approved`, the new device's id.
    PairingInfo:
      type: object
      required: [userCode, clientName, expiresAt]
      properties:
        userCode:
          type: string
          example: BCDF-GHJK
        clientName:
          type: string
          nullable: true
          description: What the watch calls itself. Chosen by the watch, so not to be trusted or rendered as markup.
        expiresAt:
          type: string
          format: date-time
    ApprovePairingRequest:
      type: object
      required: [userCode]
      properties:
        userCode:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 64
          description: The device's name in the user's list. Defaults to the name the watch gave itself.
    Device:
      type: object
      required: [id, name, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: When the device last called the API (recorded at most once an hour); null if it never has.
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    UploadMessageRequest:
      type: object
      required: [messageId, audio]
      properties:
        messageId:
          type: string
          minLength: 1
          maxLength: 255
          description: The client's own name for the recording (the watch uses its file name). The idempotency key, within the device.
          example: voice_1791004922779.opus
        audio:
          type: string
          description: Base64 of the recording (Ogg/Opus).
    StorageState:
      type: string
      enum: [ok, nearly_full, full]
      description: |
        `ok` below 90% of the limit, `nearly_full` from 90%, and `full` when an upload had to delete the account's
        oldest recordings to make room (only an upload answer says `full`).
    StorageStatus:
      type: object
      required: [usedBytes, limitBytes, state]
      properties:
        usedBytes:
          type: integer
          format: int64
          description: What the user's recordings take.
        limitBytes:
          type: integer
          format: int64
          description: The limit of the user's plan (100 MiB).
        state:
          $ref: '#/components/schemas/StorageState'
    DeleteAllResult:
      type: object
      required: [ok, deleted]
      properties:
        ok:
          type: boolean
        deleted:
          type: integer
          description: How many recordings were deleted.
    UploadMessageResult:
      type: object
      required: [ok, id, messageId, bytesReceived, duplicate, receivedAt, storage, pruned]
      properties:
        ok:
          type: boolean
          description: Always true. (The Side Service checks it, as it does for the older route.)
        id:
          type: string
          format: uuid
          description: The message's id on the server.
        messageId:
          type: string
        bytesReceived:
          type: integer
          format: int64
          description: Size of the decoded recording in bytes.
        duplicate:
          type: boolean
          description: True when this device had already uploaded this `messageId` and nothing new was stored.
        receivedAt:
          type: string
          format: date-time
        storage:
          $ref: '#/components/schemas/StorageStatus'
        pruned:
          type: integer
          description: How many of the account's oldest recordings this upload deleted to make room (0 for a repeat).
    Message:
      type: object
      required: [id, messageId, deviceId, deviceName, bytesReceived, durationMs, hasWav, receivedAt]
      properties:
        id:
          type: string
          format: uuid
        messageId:
          type: string
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        bytesReceived:
          type: integer
          format: int64
        durationMs:
          type: integer
          nullable: true
          description: Length of the audio; null when the recording could not be decoded.
        hasWav:
          type: boolean
          description: |
            Whether the recording can be played as WAV: it decoded when it was received. The WAV is made when it is
            played and is not stored (the original, an Ogg/Opus file, always is).
        receivedAt:
          type: string
          format: date-time
    MessageList:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: string
          nullable: true
          description: Pass as `before` to get the next page; null when there is no more.
    ErrorCode:
      type: string
      description: What went wrong, for clients to act on and translate. `error` is an English sentence for logs.
      enum:
        - invalid_request
        - invalid_email
        - weak_password
        - invalid_invite
        - email_taken
        - invalid_credentials
        - wrong_password
        - unauthorized
        - too_many_attempts
        - forbidden_origin
        - invalid_user_code
        - invalid_device_code
        - expired_token
        - not_found
        - payload_too_large
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: Always true.
    Error:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          description: Always false.
        error:
          type: string
          description: Short, human-readable reason in English.
        code:
          $ref: '#/components/schemas/ErrorCode'
