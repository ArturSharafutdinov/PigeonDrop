# golangci-lint v2. The default set (errcheck, govet, ineffassign, staticcheck, unused) plus a few that catch
# the mistakes a server like this is most likely to make. Generated code (api.gen.go, dbgen/) is skipped.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose # an HTTP response body that is never closed leaks a connection
    - errorlint # errors compared or unwrapped the old way (use errors.Is / errors.As)
    - misspell
    - noctx # an HTTP request made without a context cannot be cancelled
  exclusions:
    generated: strict
    presets:
      - std-error-handling # Close, Flush and the like whose error nobody can act on
      - common-false-positives
    rules:
      # Tests start servers and build requests without a context on purpose, and a setup call whose error nobody
      # reads is noise there: a broken setup fails the assertions that follow.
      - path: _test\.go
        linters:
          - noctx
          - errcheck

  settings:
    staticcheck:
      # golangci-lint's own default set, minus QF1001 (De Morgan's law): `!(a && b)` often reads better than the rewrite.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]

formatters:
  enable:
    - gofmt
