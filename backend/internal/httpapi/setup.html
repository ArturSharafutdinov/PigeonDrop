<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PigeonDrop - server setup</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  .code { font-family: monospace; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
  label { display: block; margin: 16px 0 4px; font-weight: bold; }
  input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
  .option { margin: 8px 0; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  #status { margin-top: 16px; font-weight: bold; }
  #status.error { color: #b00020; }
  #status.ok { color: #1a7a1a; }
</style>
</head>
<body>
  <h1>PigeonDrop - настройка сервера</h1>
  <p>Код устройства: <span class="code" id="code"></span></p>

  <form id="form">
    <div class="option">
      <input type="radio" name="mode" value="default" id="mode-default">
      <label style="display:inline" for="mode-default">Использовать сервер по умолчанию</label>
    </div>
    <div class="option">
      <input type="radio" name="mode" value="custom" id="mode-custom">
      <label style="display:inline" for="mode-custom">Свой сервер</label>
    </div>

    <label for="url">Адрес сервера</label>
    <input type="text" id="url" placeholder="https://example.com" disabled>

    <button type="submit">Сохранить</button>
  </form>

  <p id="status"></p>
  <p>После сохранения нажмите «Синхронизация» на часах.</p>

<script>
  const code = new URLSearchParams(location.search).get('code')
  const codeEl = document.getElementById('code')
  const form = document.getElementById('form')
  const urlInput = document.getElementById('url')
  const modeDefault = document.getElementById('mode-default')
  const modeCustom = document.getElementById('mode-custom')
  const statusEl = document.getElementById('status')

  function setStatus(text, kind) {
    statusEl.textContent = text
    statusEl.className = kind || ''
  }

  function applyMode() {
    urlInput.disabled = !modeCustom.checked
  }
  modeDefault.addEventListener('change', applyMode)
  modeCustom.addEventListener('change', applyMode)

  if (!code) {
    setStatus('В ссылке отсутствует код устройства (?code=...).', 'error')
    form.style.display = 'none'
  } else {
    codeEl.textContent = code

    // Defensive upsert: the watch already tries to register this code over
    // BLE when the QR is generated, but that request can fail to reach the
    // server (no Bluetooth connection at that moment). Doing it again here
    // is idempotent and makes sure an account always exists by the time the
    // user gets to this form, regardless of which path got there first.
    fetch('/accounts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    })
      .then((res) => res.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || 'unknown error')

        if (data.customServerUrl) {
          modeCustom.checked = true
          urlInput.value = data.customServerUrl
        } else {
          modeDefault.checked = true
        }
        applyMode()
      })
      .catch((err) => setStatus('Не удалось загрузить аккаунт: ' + err.message, 'error'))
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault()

    const customServerUrl = modeCustom.checked ? urlInput.value.trim() : null

    if (modeCustom.checked && !customServerUrl) {
      setStatus('Введите адрес сервера.', 'error')
      return
    }

    fetch('/accounts/' + encodeURIComponent(code), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customServerUrl }),
    })
      .then((res) => res.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || 'unknown error')
        setStatus('Сохранено: ' + data.serverUrl, 'ok')
      })
      .catch((err) => setStatus('Не удалось сохранить: ' + err.message, 'error'))
  })
</script>
</body>
</html>
