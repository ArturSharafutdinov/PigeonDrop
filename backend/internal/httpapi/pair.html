<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PigeonDrop</title>
<link rel="stylesheet" href="/pair.css">
</head>
<body>
<main>
  <!-- Every element with data-i18n (its text), data-i18n-label (aria-label) or data-i18n-placeholder is filled in from
       pair.en.json / pair.ru.json by pair.js. The page is empty without the script, which it needs anyway. -->
  <div class="top">
    <h1>PigeonDrop</h1>
    <nav class="lang" data-i18n-label="lang_label">
      <button type="button" id="lang-en" lang="en" aria-pressed="false">EN</button>
      <button type="button" id="lang-ru" lang="ru" aria-pressed="false">RU</button>
    </nav>
  </div>
  <p id="notice" role="status" hidden></p>

  <!-- One row of tabs for everything on the page: a visitor who is not signed in sees Sign in, Register and Personal
       server; a signed-in person sees Account and Personal server (pair.js decides which). -->
  <nav class="tabs" id="tabs" data-i18n-label="tabs_label" hidden>
    <button type="button" id="tab-login" aria-pressed="true" data-i18n="tab_login"></button>
    <button type="button" id="tab-register" aria-pressed="false" data-i18n="tab_register"></button>
    <button type="button" id="tab-account" aria-pressed="false" data-i18n="tab_account" hidden></button>
    <button type="button" id="tab-personal" aria-pressed="false" data-i18n="tab_personal"></button>
  </nav>

  <!-- Not signed in -->
  <section id="guest" hidden>
    <form id="login-form">
      <label><span data-i18n="email"></span> <input name="email" type="email" autocomplete="username" required></label>
      <label><span data-i18n="password"></span> <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" data-i18n="login_submit"></button>
    </form>

    <form id="register-form" hidden>
      <label><span data-i18n="invite_code"></span> <input name="inviteCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required></label>
      <label><span data-i18n="email"></span> <input name="email" type="email" autocomplete="username" required></label>
      <label><span data-i18n="password"></span> <input name="password" type="password" autocomplete="new-password" minlength="12" required>
        <small data-i18n="password_hint"></small></label>
      <button type="submit" data-i18n="register_submit"></button>
    </form>
  </section>

  <!-- Personal server: the address and access token of a server the person runs themselves, encrypted here in the
       browser with a key that only the watch has (it is in the QR code, after the #), for the watch to pick up. -->
  <section id="personal" hidden>
    <h2 data-i18n="personal_title"></h2>
    <p data-i18n="personal_lead"></p>
    <p id="personal-blocked" class="warn" hidden></p>

    <form id="personal-form" autocomplete="off" novalidate>
      <label for="personal-address"><span data-i18n="personal_address"></span></label>
      <input id="personal-address" name="address" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://example.com/pigeondrop" aria-describedby="personal-address-error">
      <small id="personal-address-error" class="field-error" hidden></small>

      <label for="personal-token"><span data-i18n="personal_token"></span></label>
      <input id="personal-token" name="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" aria-describedby="personal-token-hint personal-token-error">
      <small id="personal-token-hint" class="hint" data-i18n="personal_token_hint"></small>
      <small id="personal-token-error" class="field-error" hidden></small>
      <p><button type="button" id="personal-show" class="link" aria-pressed="false"></button></p>

      <button type="submit" data-i18n="personal_submit"></button>
    </form>

    <div id="personal-done" role="status" tabindex="-1" hidden>
      <h3 data-i18n="personal_done_title"></h3>
      <p data-i18n="personal_done"></p>
      <p id="personal-host" class="host"></p>
    </div>

    <div class="privacy">
      <p data-i18n="personal_privacy_1"></p>
      <p class="warn" data-i18n="personal_privacy_2"></p>
      <p class="hint" data-i18n="personal_privacy_3"></p>
    </div>
  </section>

  <!-- Signed in -->
  <section id="user" hidden>
    <p class="who"><span data-i18n="signed_in_as"></span> <strong id="who"></strong> <button type="button" id="logout" class="link" data-i18n="logout"></button></p>

    <section id="pairing">
      <h2 data-i18n="pair_title"></h2>
      <form id="lookup-form">
        <label><span data-i18n="pair_code_label"></span> <input name="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" required></label>
        <button type="submit" data-i18n="pair_find"></button>
      </form>
      <form id="approve-form" hidden>
        <p><span data-i18n="pair_watch"></span> <strong id="pairing-client"></strong> <span data-i18n="pair_asks"></span></p>
        <p data-i18n="pair_their_code"></p>
        <p class="code" id="pairing-code"></p>
        <p class="warn" data-i18n="pair_compare"></p>
        <label><span data-i18n="pair_name"></span> <input name="name" type="text" maxlength="64" autocomplete="off"></label>
        <button type="submit" data-i18n="pair_approve"></button>
        <button type="button" id="approve-cancel" class="link" data-i18n="cancel"></button>
      </form>
    </section>

    <section id="devices">
      <h2 data-i18n="devices_title"></h2>
      <ul id="device-list" class="rows"></ul>
      <p id="device-empty" class="hint" data-i18n="devices_empty" hidden></p>
    </section>

    <section id="telegram" hidden>
      <h2>Telegram</h2>
      <p id="telegram-state" class="hint"></p>
      <p id="telegram-blocked" class="warn" data-i18n="telegram_blocked" hidden></p>
      <div class="row">
        <button type="button" id="telegram-link"></button>
        <button type="button" id="telegram-unlink" class="link danger" data-i18n="telegram_unlink" hidden></button>
      </div>
      <p id="telegram-wait" hidden>
        <a id="telegram-open" class="button" href="#" target="_blank" rel="noopener noreferrer" data-i18n="telegram_open"></a>
        <span class="hint" data-i18n="telegram_wait"></span>
      </p>
      <p class="hint" data-i18n="telegram_privacy"></p>
    </section>

    <section id="messages">
      <div class="section-head">
        <h2 data-i18n="messages_title"></h2>
        <a id="download-all" class="button" href="/v1/messages/archive" download data-i18n="download_all" hidden></a>
      </div>
      <p id="storage-line" class="hint"></p>
      <p id="storage-warning" class="warn" data-i18n="storage_warning" hidden></p>
      <p id="transcript-note" class="hint" hidden><span data-i18n="note_before"></span><a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener">CC BY 4.0</a><span data-i18n="note_after"></span></p>
      <ul id="message-list" class="rows"></ul>
      <p id="message-empty" class="hint" data-i18n="messages_empty" hidden></p>
      <button type="button" id="more" data-i18n="show_more" hidden></button>
      <p><button type="button" id="delete-all" class="link danger" data-i18n="delete_all" hidden></button></p>
    </section>
  </section>
</main>
<script src="/pair.texts.js"></script>
<script src="/pair.relay.js"></script>
<script src="/pair.js"></script>
</body>
</html>
