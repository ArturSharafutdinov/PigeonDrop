name: CI/CD

# Checks run on every push to main and on every pull request. Only a push to
# main that touches backend/ (or the deploy script), or a manual run ("Run
# workflow", which always deploys), can deploy, and only the Go server is
# deployed: the watch app is published through Zepp, not from here. The image
# is built here and pushed to GitHub's container registry; Coolify on the VPS
# only pulls and runs it, so the build never competes with the other projects
# for the VPS. The deploy job needs the three Coolify secrets described in
# backend/DEPLOY.md; without them it still pushes the image, says that it did
# not deploy, and finishes, so this workflow is safe to push before Coolify is
# set up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # A run with no database must fail, not skip every test and look green.
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code -- . ':!tools'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Tests (with the race detector)
        run: go test -race ./...
      - name: Build the Docker image
        run: docker build --tag pigeondrop-backend .

  watch-app:
    name: Watch app tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The tests load the app's real source with the Zepp OS modules stubbed, so nothing needs installing.
      - name: Run tests
        run: npm test
        working-directory: PigeonDrop

  watch-build:
    name: Watch app build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the Zepp OS CLI
        run: npm install --global @zeppos/zeus-cli@1.9.3
      # config.js is gitignored (it holds the real server URL); the example is enough to compile.
      - name: Build the app
        run: |
          cp config.example.js config.js
          zeus build < /dev/null
          ls dist
        working-directory: PigeonDrop

  # The deploy script is the one part of the pipeline that can only fail on release day, so it is tested here
  # against a fake Coolify API (every outcome: success, failure, refusal, unreachable, no secrets).
  deploy-script:
    name: Deploy script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the tests against a fake Coolify
        run: .github/scripts/test/test-coolify-deploy.sh

  deploy:
    name: Deploy to Coolify
    needs: [backend, deploy-script]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # to push the image to ghcr.io
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pushes that only touch the watch app or the docs must not rebuild or restart the server.
      - name: Check whether the backend changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # When the previous commit is unknown (first push, force push) deploy to be safe.
          deploy=true
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- backend .github/scripts && deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy the backend: $deploy"

      # The image is tagged with the commit (to roll back to, and to tell what is running: `pigeondrop version`
      # prints it) and as latest (what the Coolify application runs).
      - name: Build and push the image
        if: steps.changed.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build backend \
            --build-arg VERSION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --tag "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          echo "Pushed $image:$GITHUB_SHA and $image:latest"

      - name: Deploy and wait for Coolify
        if: steps.changed.outputs.deploy == 'true'
        run: .github/scripts/coolify-deploy.sh
