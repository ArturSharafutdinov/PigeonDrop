name: CI/CD

# Checks run on every push to main and on every pull request. Only a push to
# main after which backend/ (or the deploy script) differs from what is
# deployed, or a manual run ("Run workflow", which always deploys), can deploy,
# and only the Go server is deployed: the watch app is published through Zepp,
# not from here. "What is deployed" is the commit in the image tagged
# `deployed`, which this workflow sets after Coolify confirms a deployment (see
# .github/scripts/backend-changed.sh for why it is not simply the previous
# push). The image is built here and pushed to GitHub's container registry;
# Coolify on the VPS only pulls and runs it, so the build never competes with
# the other projects for the VPS. The deploy job needs the three Coolify
# secrets described in backend/DEPLOY.md; without them it still pushes the
# image, says that it did not deploy, and finishes, so this workflow is safe to
# push before Coolify is set up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # A run with no database must fail, not skip every test and look green.
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code -- . ':!tools'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Tests (with the race detector)
        run: go test -race ./...
      - name: Build the Docker image
        run: docker build --tag pigeondrop-backend .

  watch-app:
    name: Watch app tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The tests load the app's real source with the Zepp OS modules stubbed, so nothing needs installing.
      - name: Run tests
        run: npm test
        working-directory: PigeonDrop

  watch-build:
    name: Watch app build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the Zepp OS CLI
        run: npm install --global @zeppos/zeus-cli@1.9.3
      # config.js is gitignored (it holds the real server URL); the example is enough to compile.
      - name: Build the app
        run: |
          cp config.example.js config.js
          zeus build < /dev/null
          ls dist
        working-directory: PigeonDrop

  # The deploy script is the one part of the pipeline that can only fail on release day, so it is tested here
  # against a fake Coolify API (every outcome: success, failure, refusal, unreachable, no secrets).
  deploy-script:
    name: Deploy script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the tests against a fake Coolify
        run: .github/scripts/test/test-coolify-deploy.sh
      - name: Run the tests of the check for backend changes
        run: .github/scripts/test/test-backend-changed.sh

  deploy:
    name: Deploy to Coolify
    needs: [backend, deploy-script]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # to push the image to ghcr.io
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"

      # Pushes that only touch the watch app or the docs must not rebuild or restart the server, but a backend
      # change that has not been deployed yet (its own run was cancelled or failed) must not be forgotten either.
      - name: Check whether the backend changed since the last deployment
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_IMAGE: ${{ env.IMAGE }}:deployed
        run: .github/scripts/backend-changed.sh

      # The image is tagged with the commit (to roll back to, and to tell what is running: `pigeondrop version`
      # prints it) and as latest (what the Coolify application runs). The label is how the next run finds out
      # which commit an image was built from.
      - name: Build and push the image
        if: steps.changed.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          docker build backend \
            --build-arg VERSION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$GITHUB_SHA and $IMAGE:latest"

      - name: Deploy and wait for Coolify
        id: coolify
        if: steps.changed.outputs.deploy == 'true'
        run: .github/scripts/coolify-deploy.sh

      # Only a deployment that Coolify confirmed counts: a failed or unconfirmed one leaves the tag where it was, so
      # the next push deploys again, whatever it touches.
      - name: Mark the commit as deployed
        if: steps.coolify.outputs.deployed == 'true'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:deployed"
          docker push "$IMAGE:deployed"
